# Signoff limits for `make harden-soc CPU=hazard3` (soc_top with Hazard3 instead of PicoRV32, run tag
# soc_top_hazard3; Phase 5, ADR-0011). A copy of signoff/limits/soc_top.toml: the Hazard3 run is
# judged by the same criteria. Values that describe the PicoRV32 layout (counts measured on its run)
# are re-measured on the Hazard3 run and noted where they differ.
#
# Original header of soc_top.toml:
# Signoff limits for `make harden-soc` (soc_top with the SRAM macro; Phase 3, updated in Phase 4).
# Checked by signoff/scripts/check_signoff.py; every row must PASS, a missing metric is a FAIL.
# Sources: project-plan.md §7.2 (signoff metrics) and §8 Phase 3 exit criteria.
# soc_top-specific checks that are not metrics (SRAM placement, port 1 tie-off, Magic DRC only
# inside the SRAM outline, ...) are in pnr/soc_top/check_soc.py.

[equal]
"flow__errors__count" = 0
"design__lint_error__count" = 0
"synthesis__check_error__count" = 0
"design__instance_unmapped__count" = 0
# Exactly one macro: sram0 (check_soc.py also checks its name and placement).
"design__instance__count__macros" = 1
"design__power_grid_violation__count" = 0
"design__disconnected_pin__count" = 0
"design__critical_disconnected_pin__count" = 0
"route__drc_errors" = 0
# The antenna checker sees the nets on SRAM inputs because the SRAM LEF carries ANTENNAGATEAREA
# (docs/decisions/0008-sram-antenna-lef.md; negative test P06).
"antenna__violating__nets" = 0
"antenna__violating__pins" = 0
"route__antenna_violation__count" = 0
"klayout__drc_error__count" = 0
"magic__illegal_overlap__count" = 0
"design__xor_difference__count" = 0
"design__lvs_error__count" = 0
"timing__setup_vio__count" = 0
"timing__hold_vio__count" = 0
"design__max_slew_violation__count" = 0
"design__max_cap_violation__count" = 0
"design__max_fanout_violation__count" = 0
# Drivers without extracted parasitics (STA report_parasitic_annotation), all of them driving no
# routed wire. Re-derived for Hazard3 (2026-10-07, harden 5 at 3a28d54; the value 133 copied from
# soc_top.toml was the PicoRV32 layout): 125 = 81 CTS dummy-load (clkload*) outputs + 32 unused SRAM
# read-port outputs (sram0/dout1[31:0], connected to the RTL wires unused_sram_dout1) + 12 unused
# tie-cell outputs (12 conb_1: 11 use LO and leave HI open, 1 uses HI and leaves LO open). Checked
# in runs/soc_top_hazard3/*-openroad-stapostpnr/*/filter_unannotated.log (125 in all 15 corners).
# Same structure as PicoRV32 (133 = 90 + 32 + 11); the clock tree and the tie cells differ. Any
# other unannotated driver changes the count and FAILs.
"timing__unannotated_net__count" = 125
"timing__unannotated_net_filtered__count" = 0

# §7.2 also asked for "nom_tt setup worst slack >= 10 % of the clock period" (4 ns). Removed
# (user decision 2026-10-04, docs/notes/signoff_criteria_soc_top.md): the ss delays are 1.4-1.9 x
# tt, so "ss >= 0" is always stricter and the rule never decided anything. The margin is in the
# clock uncertainty instead, with its components listed (pnr/soc_top/clock_uncertainty.sdc).
# The nom_tt slack is still printed in [info].

[max_sum]
# Static IR drop: VDD drop + GND rise <= 20 mV. The ss corner is characterized at 1.60 V and the
# lowest supply of the carrier (Caravel VCCD) is 1.62 V, so a cell may lose only 20 mV between its
# VPWR and VGND before the ss STA stops being pessimistic (user decision 2026-10-04; was 5 % of VDD
# = 90 mV on the VDD drop alone in project-plan.md §7.2). LibreLane's ir__drop__worst is the VDD
# drop only, so both nets are summed here (the sum of the two worst values is >= the worst sum on
# any one cell). Supply model: one side only (VSRC_LOC_FILES in config.json); the worst corner
# combination of that model is in docs/notes/ir_worst_case_soc_top.md. The SRAM current comes from
# the analytical .lib (ADR-0007).
"ir_vdd_drop_plus_gnd_rise" = { keys = ["design_powergrid__drop__worst__net:vccd1", "design_powergrid__drop__worst__net:vssd1"], max = 0.02 }

[corners]
# STA_CORNERS of pnr/soc_top/config.json: LibreLane's 9 plus the temperature-inversion PVTs
# ss_n40C_1v60 and ff_100C_1v95 (Phase 4).
names = [
    "nom_tt_025C_1v80", "nom_ss_100C_1v60", "nom_ff_n40C_1v95", "nom_ss_n40C_1v60", "nom_ff_100C_1v95",
    "min_tt_025C_1v80", "min_ss_100C_1v60", "min_ff_n40C_1v95", "min_ss_n40C_1v60", "min_ff_100C_1v95",
    "max_tt_025C_1v80", "max_ss_100C_1v60", "max_ff_n40C_1v95", "max_ss_n40C_1v60", "max_ff_100C_1v95",
]
setup_ws_min = 0.0
hold_ws_min = 0.0
# One clock period (44 ns, CLOCK_PERIOD): a huge or infinite slack means no constrained path
# (e.g. a lost clock) -> FAIL.
slack_max = 44.0

[golden_tolerance]
# ADR-0015 (user decision 2026-10-07). The Hazard3 flow has two steps that are not repeatable: the
# last global_route of OpenROAD.RepairDesignPostGRT (step 41; 5 of 27 runs of the same input differ)
# and the multi-threaded detailed router (its antenna repair can run one more round). Measured on the
# golden run (harden 5) against 4 others: harden 6 (step 41 differed), harden 7 (only detailed
# routing differed) and two runs continued from step 41 re-runs that differed (p5h3 worktree
# runs/exp_t41_r4, runs/exp_t41_r17); signoff/golden/soc_top_hazard3/README.md. Each tolerance is about
# 5 x the largest difference seen (in brackets), rounded up. Continuous quantities only here; counts
# and areas are in [golden_layout_tolerance], violation counts are never tolerated.
"timing__setup__ws*" = { abs = 0.2 }          # [0.040 ns]
"timing__hold__ws*" = { abs = 0.32 }          # [0.063 ns]
"timing__setup_r2r__ws*" = { abs = 0.2 }      # [0.040 ns]
"timing__hold_r2r__ws*" = { abs = 0.32 }      # [0.063 ns]
"clock__skew__*" = { abs = 0.25 }             # [0.048 ns]
"route__wirelength" = { rel = 0.0051 }        # [0.101 %]
"route__wirelength__iter:*" = { rel = 0.006 } # [0.117 %]
"route__wirelength__max" = { rel = 0.015 }    # [0.297 %]
"route__wirelength__estimated" = { rel = 0.0025 }  # [0.046 %]
"global_route__wirelength" = { rel = 0.0045 } # [0.086 %]
"route__vias*" = { rel = 0.0033 }             # [0.064 %]
"power__*" = { rel = 0.0031 }                 # [0.060 %]
"design_powergrid__*" = { rel = 0.0021 }      # [0.040 %]
"ir__*" = { rel = 0.0055 }                    # [0.108 %]
"design__instance__displacement__*" = { rel = 0.7 }  # [14 %; detailed placement inside the repair steps]
# route__drc_errors__iter:N is the count after iteration N of the last router call that reached it
# (intermediate numbers). Up to 262 apart here (PicoRV32 Phase 4: 3). The final route__drc_errors
# stays exact ([equal] = 0 and golden). neg_pnr.py P31.
"route__drc_errors__iter:*" = { abs = 1310 }  # [262]

[golden_layout_tolerance]
# ADR-0015: layout counts and areas that follow the routing (see [golden_tolerance] for the data;
# about 5 x the largest difference, in brackets). check_signoff.py refuses a pattern here that matches
# an [equal] key or a violation/error count. neg_pnr.py P50.
"antenna_diodes_count" = { abs = 55 }                                  # [11, golden 100]
"design__instance__count__class:antenna_cell" = { abs = 65 }           # [13]
"design__instance__area__class:antenna_cell" = { abs = 165 }           # [32.5 um^2]
"design__instance__count__stdcell" = { abs = 70 }                      # [14 of 30,474]
"design__instance__area__stdcell" = { abs = 210 }                      # [42 um^2]
"design__instance__count" = { abs = 30 }                               # [6]
"design__instance__count__class:fill_cell" = { abs = 85 }              # [17]
"design__instance__area__class:fill_cell" = { abs = 210 }              # [42 um^2]
"design__instance__area__class:multi_input_combinational_cell" = { abs = 65 }  # [12.5 um^2]
"design__instance__count__class:timing_repair_buffer" = { abs = 30 }   # [6]
"design__instance__area__class:timing_repair_buffer" = { abs = 150 }   # [30 um^2]
"design__instance__count__setup_buffer" = { abs = 10 }                 # [2]
"design__instance__utilization" = { abs = 0.0003 }                     # [0.000055]
"design__instance__utilization__stdcell" = { abs = 0.00045 }           # [0.000088]
"route__net" = { abs = 30 }                                            # [6]
"global_route__vias" = { abs = 320 }                                   # [63; vias of the last incremental global route]

[golden_optional]
# ADR-0015: keys that may exist in only one of the run and the golden. The router ran 5 or 7
# iterations (route__*__iter:6 and :7 come and go); RSZ-0062 (ResizerTimingPostGRT left a
# violation) and GRT-0243 (antenna repair could not fix one net with a diode) came and went.
# neg_pnr.py P51.
keys = [
    "route__drc_errors__iter:*",
    "route__wirelength__iter:*",
    "flow__warnings__count:RSZ-0062",
    "flow__warnings__count:GRT-0243",
]

[info]
keys = [
    "timing__setup__ws__corner:nom_tt_025C_1v80",
    "magic__drc_error__count",
    "design__instance__count",
    "design__instance__area__stdcell",
    "design__instance__utilization",
    "timing__setup__ws",
    "timing__hold__ws",
    "ir__drop__worst",
    "power__total",
]
