# Signoff limits for `make harden-soc CPU=hazard3` (soc_top with Hazard3 instead of PicoRV32, run tag
# soc_top_hazard3; Phase 5, ADR-0011). A copy of signoff/limits/soc_top.toml: the Hazard3 run is
# judged by the same criteria. Values that describe the PicoRV32 layout (counts measured on its run)
# are re-measured on the Hazard3 run and noted where they differ.
#
# Original header of soc_top.toml:
# Signoff limits for `make harden-soc` (soc_top with the SRAM macro; Phase 3, updated in Phase 4).
# Checked by signoff/scripts/check_signoff.py; every row must PASS, a missing metric is a FAIL.
# Sources: project-plan.md §7.2 (signoff metrics) and §8 Phase 3 exit criteria.
# soc_top-specific checks that are not metrics (SRAM placement, port 1 tie-off, Magic DRC only
# inside the SRAM outline, ...) are in pnr/soc_top/check_soc.py.

[equal]
"flow__errors__count" = 0
"design__lint_error__count" = 0
"synthesis__check_error__count" = 0
"design__instance_unmapped__count" = 0
# Exactly one macro: sram0 (check_soc.py also checks its name and placement).
"design__instance__count__macros" = 1
"design__power_grid_violation__count" = 0
"design__disconnected_pin__count" = 0
"design__critical_disconnected_pin__count" = 0
"route__drc_errors" = 0
# The antenna checker sees the nets on SRAM inputs because the SRAM LEF carries ANTENNAGATEAREA
# (docs/decisions/0008-sram-antenna-lef.md; negative test P06).
"antenna__violating__nets" = 0
"antenna__violating__pins" = 0
"route__antenna_violation__count" = 0
"klayout__drc_error__count" = 0
"magic__illegal_overlap__count" = 0
"design__xor_difference__count" = 0
"design__lvs_error__count" = 0
"timing__setup_vio__count" = 0
"timing__hold_vio__count" = 0
"design__max_slew_violation__count" = 0
"design__max_cap_violation__count" = 0
"design__max_fanout_violation__count" = 0
# Drivers without extracted parasitics (STA report_parasitic_annotation), all of them driving no
# routed wire. 133 = 90 CTS dummy-load (clkload*) outputs + 32 unused SRAM read-port outputs
# (sram0/dout1[31:0], connected to the RTL wires unused_sram_dout1) + 11 unused tie-cell outputs
# (11 conb_1: 10 use LO and leave HI open, 1 uses HI and leaves LO open). Checked in
# runs/soc_top/*-openroad-stapostpnr/*/checks.rpt (same list in every corner). Any other
# unannotated driver changes the count and FAILs. (Phase 3: 134 with 91 dummy loads; the Phase 4
# clock tree has one fewer, re-checked 2026-10-04.)
"timing__unannotated_net__count" = 133
"timing__unannotated_net_filtered__count" = 0

# §7.2 also asked for "nom_tt setup worst slack >= 10 % of the clock period" (4 ns). Removed
# (user decision 2026-10-04, docs/notes/signoff_criteria_soc_top.md): the ss delays are 1.4-1.9 x
# tt, so "ss >= 0" is always stricter and the rule never decided anything. The margin is in the
# clock uncertainty instead, with its components listed (pnr/soc_top/clock_uncertainty.sdc).
# The nom_tt slack is still printed in [info].

[max_sum]
# Static IR drop: VDD drop + GND rise <= 20 mV. The ss corner is characterized at 1.60 V and the
# lowest supply of the carrier (Caravel VCCD) is 1.62 V, so a cell may lose only 20 mV between its
# VPWR and VGND before the ss STA stops being pessimistic (user decision 2026-10-04; was 5 % of VDD
# = 90 mV on the VDD drop alone in project-plan.md §7.2). LibreLane's ir__drop__worst is the VDD
# drop only, so both nets are summed here (the sum of the two worst values is >= the worst sum on
# any one cell). Supply model: one side only (VSRC_LOC_FILES in config.json); the worst corner
# combination of that model is in docs/notes/ir_worst_case_soc_top.md. The SRAM current comes from
# the analytical .lib (ADR-0007).
"ir_vdd_drop_plus_gnd_rise" = { keys = ["design_powergrid__drop__worst__net:vccd1", "design_powergrid__drop__worst__net:vssd1"], max = 0.02 }

[corners]
# STA_CORNERS of pnr/soc_top/config.json: LibreLane's 9 plus the temperature-inversion PVTs
# ss_n40C_1v60 and ff_100C_1v95 (Phase 4).
names = [
    "nom_tt_025C_1v80", "nom_ss_100C_1v60", "nom_ff_n40C_1v95", "nom_ss_n40C_1v60", "nom_ff_100C_1v95",
    "min_tt_025C_1v80", "min_ss_100C_1v60", "min_ff_n40C_1v95", "min_ss_n40C_1v60", "min_ff_100C_1v95",
    "max_tt_025C_1v80", "max_ss_100C_1v60", "max_ff_n40C_1v95", "max_ss_n40C_1v60", "max_ff_100C_1v95",
]
setup_ws_min = 0.0
hold_ws_min = 0.0
# One clock period (43 ns, CLOCK_PERIOD): a huge or infinite slack means no constrained path
# (e.g. a lost clock) -> FAIL.
slack_max = 43.0

[golden_tolerance]
# The detailed router is not deterministic (measured in Phase 2, signoff/golden/picorv32_core/README.md;
# measured again for soc_top in signoff/golden/soc_top/README.md). Only these metric families may
# differ slightly from the golden run; cell counts, areas, violation counts, DRC, LVS, ... must be
# identical.
"timing__setup__ws*" = { abs = 0.01 }
"timing__hold__ws*" = { abs = 0.01 }
"timing__setup_r2r__ws*" = { abs = 0.01 }
"timing__hold_r2r__ws*" = { abs = 0.01 }
"clock__skew__*" = { abs = 0.01 }
"route__wirelength" = { rel = 0.001 }
"route__wirelength__iter:*" = { rel = 0.001 }
"route__vias*" = { rel = 0.001 }
"power__*" = { rel = 0.001 }
"design_powergrid__*" = { rel = 0.001 }
"ir__*" = { rel = 0.001 }
# Phase 4 make regress 2 (clean checkout, commit c635ffb; the input of OpenROAD.DetailedRouting
# byte-identical to regress 1): the last re-route after antenna repair left 14 instead of 11
# violations after its 2nd iteration. route__drc_errors__iter:N is the count after iteration N of
# the last router call (main route, then one re-route per antenna repair) that reached iteration N:
# intermediate numbers, not signoff numbers. abs = 100, above every count seen (87 here, 90 in
# picorv32_core).
# The final route__drc_errors stays exact ([equal] = 0 and golden). neg_pnr.py P31.
"route__drc_errors__iter:*" = { abs = 100 }

[info]
keys = [
    "timing__setup__ws__corner:nom_tt_025C_1v80",
    "magic__drc_error__count",
    "design__instance__count",
    "design__instance__area__stdcell",
    "design__instance__utilization",
    "timing__setup__ws",
    "timing__hold__ws",
    "ir__drop__worst",
    "power__total",
]
