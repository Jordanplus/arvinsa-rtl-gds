# sram_cov: spec 6.5 step 3 / fw/bootrom/bootrom.S: every one of the 512 words
# is written 6 times (M0..M4, address-in-address) and read 6 times (M1..M5,
# address-in-address), 32-bit only, and nothing runs from SRAM. A march that
# skips the last word or drops the address-in-address read-back fails here
# (review M3; the boot ROM is mask ROM in silicon).
[[test]]
name = "bootrom_march"
load = "none"
boot_mode = 1
max_cycles = 1000000
min_cycles = 100000
sram_cov = [
    { from = 0x000, to = 0x800, rd = 6, wr = 6, fetch = 0, wstrb = [0xF] },
]
expect_uart = ""
sig_rule = "const:0x4D415243"
expect_gpio = [0xB1, 0xA5]
uart_in = ""
smoke = true
negative_only = false

