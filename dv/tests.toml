# dv/tests.toml - SoC regression test list (docs/spec/soc_spec.md 6.4, 7.3).
# Fields (spec 7.3): name, load (backdoor|host|uart|none), boot_mode, max_cycles,
# expect_uart (omitted = not checked; "" = no UART output allowed),
# sig_rule (uart_crc32 | "const:0x..." | none), expect_gpio (gpio_out change
# sequence without the reset value 0; omitted = not checked), uart_in (text sent
# to uart_rx; for load = "uart" run_sim.py first sends the boot ROM loader frame
# built from fw/build/<fw>.bin), smoke, negative_only, fw (image name, default =
# test name).
# DV extensions (dv/README.md):
#   min_cycles       DONE = PASS magic must not be written before this cycle
#                    (test_ctrl checker): a firmware whose test body was skipped
#                    or shrunk prints the same PASS text, but finishes early.
#   loader_frame     load = "uart" only: valid (default) | max_words |
#                    bad_checksum | n_zero | n_too_big (dvlib.LOADER_FRAMES).
#   expect_unmapped  exact number of unmapped data accesses the test makes on
#                    purpose; bus_assert counts them instead of failing them.
#   sram_cov         SRAM access counts per word at CPU bus handshakes
#                    (coverage checker): a list of rules {from, to (byte
#                    address or ELF symbol of the test image, to exclusive),
#                    rd / wr / fetch (exact data reads / writes / instruction
#                    fetches per word), min_rd / min_wr (lower bounds), wstrb
#                    (write strobes every word must see)}. A test phase that is
#                    removed or shortened changes the counts even when the test
#                    still prints PASS and runs as long as before.
#   min_uart_stalls  at least this many UART DATA writes must be held by the
#                    transmitter-busy stall (coverage checker, spec 4.2).
#   reset_on_store   byte address or ELF symbol: the testbench drives resetn=0
#                    at the falling edge where the CPU first presents a store to
#                    it (spec 4.9, +reset_on_store); exactly one such reset must
#                    happen (coverage checker).
# A positive test (negative_only = false) must set expect_uart and expect_gpio
# and a sig_rule other than none (dvlib.load_tests rejects it otherwise).
# Every test boots from the boot ROM, which writes GPIO_OUT = 0xB0 | boot_mode
# first (spec 6.5 step 1); boot_mode 0 then jumps to SRAM.
# max_cycles: at least 5x the cycles measured on the Phase 1 RTL (Icarus,
# 2026-10-03: hello 3.5k, memtest 871k, irq 7.0k, muldiv 18k, uart_echo 6.6k,
# bootrom_march 112k, boot_uart_hello 63k, boot_host_hello 3.9k, boot_uart_max
# 363k, regs 11.5k, unmapped 10.7k; after the qualification fixes: regs 19.1k,
# uart_burst 44k, reset_store 8.6k), so a slower but still correct design does
# not time out while a hang still ends in bounded time.
# min_cycles: about 90% of the DONE cycle measured on the same RTL (memtest
# 870728, muldiv 17333, bootrom_march 111880; identical on Icarus and
# Verilator). An intended RTL timing change that makes these tests faster
# needs a new measurement here.

[[test]]
name = "hello"
load = "backdoor"
boot_mode = 0
max_cycles = 200000
expect_uart = "hello\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB0]
uart_in = ""
smoke = true
negative_only = false

# sram_cov: every word of the test area [_free_start, 0x700) gets exactly
# 88 data reads and 22 writes, with strobes 1/2/4/8/3/C (byte lane) and F
# (derivation in fw/tests/memtest/main.c; measured 2026-10-03, identical on both
# simulators). Removing the march C- phase gives 83/17 (review M2).
[[test]]
name = "memtest"
load = "backdoor"
boot_mode = 0
max_cycles = 5000000
min_cycles = 780000
sram_cov = [
    { from = "_free_start", to = 0x700, rd = 88, wr = 22, fetch = 0, wstrb = [0x1, 0x2, 0x4, 0x8, 0x3, 0xC, 0xF] },
]
expect_uart = "memtest PASS\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB0]
uart_in = ""
smoke = true
negative_only = false

