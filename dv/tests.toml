# Directed tests beyond spec 6.4 (testbench qualification findings Q-F2..Q-F4).

# UART loader with the largest legal image (spec 6.5 step 4: N = 448): the
# hello image zero-padded to 448 words.
[[test]]
name = "boot_uart_max"
fw = "boot_uart_hello"
load = "uart"
loader_frame = "max_words"
boot_mode = 2
max_cycles = 2000000
expect_uart = "hello\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB2, 0xB8]
uart_in = ""
smoke = false
negative_only = false

# Register read-back and every GPIO_OUT pin (fw/tests/regs/main.c), with
# boot_mode 3 (reserved: the boot ROM writes 0xB3 and jumps to SRAM).
[[test]]
name = "regs"
load = "backdoor"
boot_mode = 3
max_cycles = 200000
expect_uart = "regs PASS\n"
sig_rule = "uart_crc32"
# The last three values come from the cross-talk check (0x3C, 0xC3, restore 0xB3).
expect_gpio = [0xB3, 0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0xFF, 0x00, 0xB3, 0x3C, 0xC3, 0xB3]
uart_in = ""
smoke = false
negative_only = false

# Unmapped accesses and full address decode (fw/tests/unmapped/main.c, spec
# 4.2). expect_unmapped = exact number of unmapped data accesses (29 holes x 3);
# bus_assert counts them instead of failing them, for this test only.
[[test]]
name = "unmapped"
load = "backdoor"
boot_mode = 0
max_cycles = 200000
expect_uart = "unmapped PASS\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB0]
expect_unmapped = 87
uart_in = ""
smoke = false
negative_only = false

# UART DATA writes back to back (fw/tests/uart_burst/main.c, review M1): the
# bus must hold each write while the transmitter is busy (spec 4.2). The line
# has 81 bytes; all 81 writes are stalled on the Phase 1 RTL (13558 stall
# cycles; the first write by the idle period simpleuart adds after the DIV
# write). min_uart_stalls = 80 does not count on that first one.
[[test]]
name = "uart_burst"
load = "backdoor"
boot_mode = 0
max_cycles = 200000
min_uart_stalls = 80
expect_uart = "uart_burst 0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz PASS\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB0]
uart_in = ""
smoke = false
negative_only = false

# Reset in the middle of a store (fw/tests/reset_store/main.c, review m6, spec
# 4.9 RTL-RST-01): resetn=0 is sampled together with the store to rst_victim;
# the store must be dropped. The boot ROM runs twice, so GPIO_OUT goes
# 0xB0 -> 0 (reset) -> 0xB0.
[[test]]
name = "reset_store"
load = "backdoor"
boot_mode = 0
max_cycles = 200000
reset_on_store = "rst_victim"
expect_uart = "reset_store PASS\n"
sig_rule = "uart_crc32"
expect_gpio = [0xB0, 0x00, 0xB0]
uart_in = ""
smoke = false
negative_only = false

# Negative-test-only firmware (referenced from dv/bugs.toml R06a/R06b): these
# must never PASS. UART output is "any" (spec 6.4), so expect_uart is omitted.
[[test]]
name = "neg_fw_hang"
load = "backdoor"
boot_mode = 0
max_cycles = 100000
sig_rule = "none"
expect_gpio = [0xB0]
uart_in = ""
smoke = false
negative_only = true

[[test]]
name = "neg_fw_illegal"
