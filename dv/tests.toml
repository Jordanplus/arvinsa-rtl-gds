sig_rule = "none"
expect_gpio = [0xB0]
uart_in = ""
smoke = false
negative_only = true

# Boot ROM UART loader error path (spec 6.5 step 4), referenced from
# dv/bugs.toml L01-L03: a malformed frame must end with GPIO_OUT = 0xEE,
# DONE = 0xBAD0_0B00 and no UART output. The run therefore FAILs at test_ctrl
# only (bugs.toml exclusive = true); a boot ROM that accepts the frame (PASS) or
# waits for more bytes (timeout) is an escape.
[[test]]
name = "boot_uart_badck"
fw = "boot_uart_hello"
load = "uart"
loader_frame = "bad_checksum"
boot_mode = 2
max_cycles = 300000
expect_uart = ""
sig_rule = "none"
expect_gpio = [0xB2, 0xEE]
uart_in = ""
smoke = false
negative_only = true

[[test]]
name = "boot_uart_n0"
load = "uart"
loader_frame = "n_zero"
boot_mode = 2
max_cycles = 100000
expect_uart = ""
sig_rule = "none"
expect_gpio = [0xB2, 0xEE]
uart_in = ""
smoke = false
negative_only = true

[[test]]
name = "boot_uart_n449"
load = "uart"
loader_frame = "n_too_big"
boot_mode = 2
max_cycles = 100000
expect_uart = ""
sig_rule = "none"
expect_gpio = [0xB2, 0xEE]
uart_in = ""
smoke = false
negative_only = true

