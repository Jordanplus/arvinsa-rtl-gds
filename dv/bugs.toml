# dv/bugs.toml - negative tests by bug injection (docs/spec/soc_spec.md 5, 7.3).
# make neg-rtl (dv/scripts/neg.py) runs each entry and inverts the judgment: the
# run must FAIL, and at least one checker in expect_checkers must have failed
# with a message matching expect_regex. FAIL anywhere else (or a compile error)
# counts as an escape. An empty expect_regex accepts any message of the expected
# checkers (spec 5 gives no regex for R03, R05, R06a, R06b).
# Optional fields (DV extensions, dv/README.md):
#   exclusive = true   no checker outside expect_checkers may fail either
#   expect_gpio = [..] the gpio_out change sequence of the bug run must equal it
#   fw = "<image>"     run a firmware bug variant fw/build/<image>.* instead of
#                      the test's image (define must be "")
#   bootrom = "<name>" compile fw/build/bootrom__<name>.v in place of
#                      rtl/bootrom/bootrom.v (boot ROM bug variant; define "")
# Variants are built by make fw (fw/Makefile FW_VARIANTS, BOOTROM_VARIANTS).
# R01-R07 are spec 5. The entries after them come from the testbench
# qualification review (bugs that escaped every checker before): each one
# keeps a test or checker from being weakened without neg-rtl noticing.

[[bug]]
id = "R01"
define = "BUG_R01"
test = "memtest"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00040"

[[bug]]
id = "R02"
define = "BUG_R02"
test = "bootrom_march"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00e10"
# boot ROM march FAIL status on GPIO_OUT (spec 6.5 step 3)
expect_gpio = [0xB1, 0xE1]

[[bug]]
id = "R03"
define = "BUG_R03"
test = "hello"
sim = "icarus"
expect_checkers = ["x_check", "trap", "timeout"]
expect_regex = ""

[[bug]]
id = "R04"
define = "BUG_R04"
test = "hello"
sim = "icarus"
expect_checkers = ["uart_monitor"]
expect_regex = "(?i)edge|timing|framing"

[[bug]]
id = "R05"
define = "BUG_R05"
test = "irq"
sim = "icarus"
expect_checkers = ["timeout"]
expect_regex = ""

[[bug]]
id = "R06a"
define = ""
test = "neg_fw_hang"
sim = "icarus"
expect_checkers = ["timeout"]
expect_regex = ""

[[bug]]
id = "R06b"
define = ""
test = "neg_fw_illegal"
sim = "icarus"
expect_checkers = ["trap"]
expect_regex = ""

[[bug]]
id = "R07"
define = "BUG_R07"
test = "hello"
sim = "icarus"
expect_checkers = ["bus_assert"]
expect_regex = "(?i)one-?hot|decode"

# ---- testbench qualification additions -------------------------------------

# addr0[8] stuck at 0 must also break memtest (spec 6.2: memtest covers the
# upper SRAM half to catch addr0[8] faults; project-plan.md 7.3 R02). A memtest
# shrunk to the lower half PASSes with this bug, so this entry escapes then.
# The upper-half writes alias onto the code, so the firmware crashes (trap),
# hangs (timeout) or reports a fail code, depending on where the corruption
# lands. The regex leaves out the min_cycles message of test_ctrl, so this
# entry checks the memtest coverage on its own.
[[bug]]
id = "R02_memtest"
define = "BUG_R02"
test = "memtest"
sim = "icarus"
expect_checkers = ["test_ctrl", "trap", "timeout"]
expect_regex = "(?i)trap asserted|no DONE write|DONE=0xbad0"

# Divider result bit 0 inverted (external picorv32_pcpi_div, soc_top.v): muldiv
# must report its first div case (case 0, op div: fail code 0x104). A muldiv
# whose compare loop is skipped PASSes with this bug.
[[bug]]
id = "R08"
define = "BUG_R08"
test = "muldiv"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00104"

# Unmapped access never answered (soc_bus.v): bus_assert 1000-cycle limit.
[[bug]]
id = "R09"
define = "BUG_R09"
test = "unmapped"
sim = "icarus"
expect_checkers = ["bus_assert"]
expect_regex = "(?i)without mem_ready"

# Partial UART decode on addr[31:12] (soc_bus.v): bus_assert decode compare.
[[bug]]
id = "R10"
define = "BUG_R10"
test = "unmapped"
sim = "icarus"
expect_checkers = ["bus_assert"]
expect_regex = "(?i)decode mismatch"

# gpio_out pin 6 stuck at 0, register read-back correct (soc_gpio.v): only the
# pin sequence shows it.
[[bug]]
id = "R11"
define = "BUG_R11"
test = "regs"
sim = "icarus"
expect_checkers = ["gpio_seq"]
expect_regex = "(?i)gpio_out sequence"

# GPIO_OUT, SIG, IRQ_TRIG and UART DIV read back 0: regs must name all four
# (fail code 0x0200 | 0x01 | 0x04 | 0x08 | 0x10 = 0x021D).
[[bug]]
id = "R12"
define = "BUG_R12"
test = "regs"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad0021d"

# Host port ignores host_wmask (soc_bus.v): the testbench byte-mask check after
# the host load. The testbench stops the run there (no checker in spec 7.2
# watches the host port), so this is the only entry that expects sim_error;
# the regex keeps a compile error or crash from counting as caught.
[[bug]]
id = "R13"
define = "BUG_R13"
test = "boot_host_hello"
sim = "icarus"
expect_checkers = ["sim_error"]
expect_regex = "(?i)host port partial-wmask write mismatch"

# IRQ line held 200 cycles after IRQ_TRIG[0] is cleared (soc_test_ctrl.v): the
# handler runs 4 times instead of 2; irq reports fail code 0x20.
[[bug]]
id = "R14"
define = "BUG_R14"
test = "irq"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00020"

# DONE reads back 0 (soc_test_ctrl.v): regs writes DONE a second time with fail
# code 0x0240.
[[bug]]
id = "R15"
define = "BUG_R15"
test = "regs"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00240"

# Boot ROM UART loader error handling (spec 6.5 step 4), no RTL define: the
# stimulus is a malformed loader frame (tests.toml loader_frame). The correct
# boot ROM rejects it: GPIO_OUT 0xB2 -> 0xEE, DONE = 0xBAD0_0B00, no UART
# output, so only test_ctrl fails (exclusive). A boot ROM without the checksum
# compare or the N range check PASSes or times out instead.
[[bug]]
id = "L01"
define = ""
test = "boot_uart_badck"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00b00"
exclusive = true

[[bug]]
id = "L02"
define = ""
test = "boot_uart_n0"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00b00"
exclusive = true

[[bug]]
id = "L03"
define = ""
test = "boot_uart_n449"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00b00"
exclusive = true

# ---- Phase 1 qualification fixes (fresh bug injection, 2026-10-03) ---------
# Each entry below was an escape before the fixes: the bug passed every
# checker of make regress-rtl. The F-number is the reviewer's injection id.

# F15: TEST_CTRL partial offset decode, an IRQ_TRIG write also writes SIG
# (soc_test_ctrl.v). regs cross-talk check: writing IRQ_TRIG (index 3) changed
# SIG (index 2) -> fail code 0x0300 | 3 << 4 | 2.
[[bug]]
id = "R16"
define = "BUG_R16"
test = "regs"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00332"

# F14: UART DATA write stall ignored (soc_bus.v): bytes written while the
# transmitter is busy are dropped. uart_burst writes back to back; no write is
# held any more (coverage), and the text is short (uart_golden, signature).
[[bug]]
id = "R17"
define = "BUG_R17"
test = "uart_burst"
sim = "icarus"
expect_checkers = ["coverage"]
expect_regex = "(?i)held by the transmitter-busy stall"

# F11: csb0 not blocked by ready_q (soc_bus.v): a second SRAM access in the
# response cycle of every SRAM transaction. Functionally harmless here, so
# only the SRAM port checker sees it (spec 4.3: csb0 once per transaction).
[[bug]]
id = "R18"
define = "BUG_R18"
test = "hello"
sim = "icarus"
expect_checkers = ["sram_port"]
expect_regex = "(?i)SRAM access #2 of one transaction"

# RTL-RST-01 (spec 4.9): csb0 not gated with resetn (soc_bus.v), so the store
# presented at the edge that samples resetn=0 is written. reset_store resets
# on exactly that store; the firmware also reports it (fail code 0x03).
[[bug]]
id = "R19"
define = "BUG_R19"
test = "reset_store"
sim = "icarus"
expect_checkers = ["sram_port"]
expect_regex = "(?i)SRAM access at a rising edge that samples resetn=0"

# F19: IRQ line released 40 cycles after IRQ_TRIG[0] is cleared
# (soc_test_ctrl.v). The handler still runs exactly 2 times, so the firmware
# count cannot see it; the irq_line checker compares the line every cycle.
[[bug]]
id = "R20"
define = "BUG_R20"
test = "irq"
sim = "icarus"
expect_checkers = ["irq_line"]
expect_regex = "(?i)irq\\[4\\]=1 but IRQ_TRIG\\[0\\]=0"

# F02: UART divider reset value SOC_UART_DIV + 1 (soc_uart.v). The boot ROM
# writes DIV = 18 before the first byte, so the UART output is right; only
# the reset value check of uart_div sees it.
[[bug]]
id = "R21"
define = "BUG_R21"
test = "hello"
sim = "icarus"
expect_checkers = ["uart_div"]
expect_regex = "(?i)after reset release, expected the reset value"

# F20: IRQ line is a one-cycle pulse per IRQ_TRIG write (soc_test_ctrl.v): the
# handler runs once instead of 2 times (spec 4.8); irq fail code 0x20.
[[bug]]
id = "R22"
define = "BUG_R22"
test = "irq"
sim = "icarus"
expect_checkers = ["test_ctrl"]
expect_regex = "(?i)0xbad00020"

# F16b: memtest without its march C- phase (firmware variant
# memtest__no_march). Still prints PASS and runs longer than before (the test
# area grows), so min_cycles cannot see it; every test-area word now gets
# 83 reads / 17 writes instead of 88 / 22.
[[bug]]
id = "M01"
define = ""
fw = "memtest__no_march"
test = "memtest"
sim = "icarus"
expect_checkers = ["coverage"]
expect_regex = "(?i)SRAM coverage rule 1 .*data reads 83 \\(expected 88\\)"

# F08: boot ROM march C- and address-in-address skip the last SRAM word (boot
# ROM variant skip_last_word). Mask ROM in silicon.
[[bug]]
id = "B01"
define = ""
bootrom = "skip_last_word"
test = "bootrom_march"
sim = "icarus"
expect_checkers = ["coverage"]
expect_regex = "(?i)SRAM coverage rule 1 .*1 of 512 words off; 0x7fc"

# F12: boot ROM address-in-address read-back removed (boot ROM variant
# no_aia_readback): 5 reads per word instead of 6.
[[bug]]
id = "B02"
define = ""
bootrom = "no_aia_readback"
test = "bootrom_march"
sim = "icarus"
expect_checkers = ["coverage"]
expect_regex = "(?i)SRAM coverage rule 1 .*data reads 5 \\(expected 6\\)"

# F21: boot ROM step 1 without the UART DIV write (boot ROM variant
# no_div_write). Hidden by the correct reset value and by uart_init() in the
# firmware; uart_div sees the jump to SRAM before any DIV = 18 write.
[[bug]]
id = "B03"
define = ""
bootrom = "no_div_write"
test = "hello"
sim = "icarus"
expect_checkers = ["uart_div"]
expect_regex = "(?i)instruction fetch at 0x00000000 .*before the boot ROM wrote UART DIV"

# F17: test_pass() writes DONE before SIG (firmware variant
# hello__done_before_sig, spec 6.3). SIG is right at the end of the run, but
# not in the cycle of the DONE write, which is what the signature rule uses.
[[bug]]
id = "S01"
define = ""
fw = "hello__done_before_sig"
test = "hello"
sim = "icarus"
expect_checkers = ["signature"]
expect_regex = "(?i)SIG=0x00000000 at the DONE write"

# Guard of reset_store: a firmware that never stores to rst_victim (variant
# reset_store__no_victim) gets no mid-run reset; the coverage checker says so
# (the firmware itself also writes fail code 0x01).
[[bug]]
id = "C01"
define = ""
fw = "reset_store__no_victim"
test = "reset_store"
sim = "icarus"
expect_checkers = ["coverage"]
expect_regex = "(?i)applied 0 mid-run reset"
